<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>GuestPass source</title>
<link rel="stylesheet" href="/static/obs.css"{{if .StyleIntegrity}} integrity="{{.StyleIntegrity}}" crossorigin="anonymous"{{end}}>{{/* chromeless, font-free (EN-13); integrity added when the build manifest is present */}}
</head>
<body>
{{/* The slot label is an opaque cosmetic attribute (EN-15); the source token is read from the URL by obs.js and never rendered into the DOM. */}}
<video id="obs-video" data-slot="{{.Slot}}" autoplay playsinline muted></video>
<script type="module" src="/static/obs.js"{{if .ScriptIntegrity}} integrity="{{.ScriptIntegrity}}" crossorigin="anonymous"{{end}}></script>
</body>
</html>

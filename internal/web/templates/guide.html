<!doctype html>
<html lang="en"{{if .Theme}} data-theme="{{.Theme}}"{{end}}>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}} · GuestPass</title>
<link rel="stylesheet" href="{{assetURL "app.css"}}"{{if .StyleIntegrity}} integrity="{{.StyleIntegrity}}"{{end}}>
</head>
<body class="landing">

<header class="landing-nav">
<div class="landing-nav-inner">
<a class="logo" href="/" aria-label="GuestPass home"><span class="logo-mark"><span></span></span><span>Guest<span>Pass</span></span></a>
<nav class="landing-nav-links" aria-label="Sections">
<a href="/guide">Guide</a>
<a href="/signin">Get hosting</a>
</nav>
<div class="landing-nav-cta">
<form method="post" action="/theme">
<input type="hidden" name="next" value="{{.Path}}">
{{if eq .Theme "dark"}}<button type="submit" name="theme" value="system" class="theme-icon-btn" aria-label="Theme: Dark. Switch to system."><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4 8.5 8.5 0 1 0 20 14.5z"/></svg></button>
{{else if eq .Theme "light"}}<button type="submit" name="theme" value="dark" class="theme-icon-btn" aria-label="Theme: Light. Switch to dark."><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 1.5v2.5M12 20v2.5M3.5 3.5l1.8 1.8M18.7 18.7l1.8 1.8M1.5 12H4M20 12h2.5M3.5 20.5l1.8-1.8M18.7 5.3l1.8-1.8"/></svg></button>
{{else}}<button type="submit" name="theme" value="light" class="theme-icon-btn" aria-label="Theme: System. Switch to light."><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 1.5v2.5M12 20v2.5M3.5 3.5l1.8 1.8M18.7 18.7l1.8 1.8M1.5 12H4M20 12h2.5M3.5 20.5l1.8-1.8M18.7 5.3l1.8-1.8"/></svg></button>{{end}}
</form>
</div>
</div>
</header>

<div class="guide-shell">
<aside class="guide-sidebar">
<span class="section-kicker guide-sidebar-kicker">User guide</span>
{{range .Groups}}
<div class="guide-nav-group">
<div class="guide-nav-grouptitle">{{.Title}}</div>
{{range .Pages}}
<a class="guide-nav-link{{if eq .Slug $.Current}} on{{end}}" href="/guide/{{.Slug}}"{{if eq .Slug $.Current}} aria-current="page"{{end}}>{{.Title}}</a>
{{end}}
</div>
{{end}}
</aside>
<main class="guide-article">
<article class="guide-prose">
{{.Body}}
</article>
</main>
</div>

<footer class="landing-footer">
<div class="landing-footer-inner">
<div class="row gap-3"><span class="logo logo-sm"><span class="logo-mark"><span></span></span><span>Guest<span>Pass</span></span></span><span class="landing-footer-meta">· UEL v1.0 · guest-pass.link</span></div>
<div class="landing-footer-links">
<a href="/">Home</a>
<a href="{{.SourceURL}}" rel="noopener">Source</a>
<a href="https://uelicense.eu" rel="noopener">License</a>
</div>
</div>
</footer>
</body>
</html>

name: CI

on:
  push:
    branches: [main, "wt/**"]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          check-latest: true

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      # The dev-auth seam (AUTH_MODE=dev) compiles ONLY under the `dev` build tag
      # (AD-8 / RF-4). Build + test it here so the dev-build path and its loopback
      # BASE_URL invariant test stay green — release binaries never include this tag.
      - name: go vet (dev build tag)
        run: go vet -tags dev ./...

      - name: go test (dev build tag)
        run: go test -tags dev ./...

      # staticcheck + govulncheck run via `go run` — pure Go, no npm/node anywhere.
      # TODO: pin these to exact versions once the toolchain is settled.
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  # Headless-Chrome browser tests (chromedp + fake media, AD-9 / PD-2). Separated from the
  # `go` job because installing Chrome is heavier; runs the `[BROWSER]`-tagged tests so
  # island / OBS-source / media-tracer regressions are caught in CI, not just locally.
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          check-latest: true
      - uses: browser-actions/setup-chrome@v1
        id: setup-chrome
        with:
          chrome-version: stable
      - name: browser tests (chromedp + fake media)
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: go test -tags browser ./internal/browsertest/...
